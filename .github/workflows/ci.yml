name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Foundation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://atlas:atlas@localhost:5432/atlas_test?schema=public"
      DATABASE_TEST_URL: "postgresql://atlas:atlas@localhost:5432/atlas_test?schema=public"
      JWT_ACCESS_SECRET: "ci-test-jwt-access-secret-32-chars-long"
      REFRESH_TOKEN_PEPPER: "ci-test-refresh-pepper-32-chars-long"
      PASSWORD_RESET_PEPPER: "ci-test-reset-pepper-32-chars-long"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Deploy Migrations
        run: pnpm db:migrate

      - name: Check Code Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test Database Integration
        run: pnpm test:database

      - name: Test Authentication & Security
        run: pnpm test:auth

      - name: Test API Integration
        run: pnpm test:api

      - name: Test Domain Models
        run: pnpm test:domain

      - name: Test Foundation Rules
        run: pnpm test:foundation

      - name: Test Mobile Foundation
        run: pnpm test:mobile

      - name: Test UI & Design System
        run: pnpm test:ui

      - name: Test Web Foundation
        run: pnpm test:web

      - name: Run All Tests
        run: pnpm test

      - name: Build Applications
        run: pnpm build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Test Web E2E (Playwright)
        run: pnpm test:web:e2e