# ============================================================================
# Project Atlas — Staging Container Image Publication (.github/workflows/publish-staging-images.yml)
# Reference: Staging Infrastructure Provisioning (Amazon Lightsail sa-east-1)
#
# INVARIANTS:
# 1. Image tagging: Git SHA ONLY (no untracked 'latest' deployment).
# 2. Scope: Project Atlas staging only (atlas-staging-app).
# 3. Security: No secrets baked into images or printed in CI logs.
# 4. Production deployment: NOT AUTHORIZED.
# ============================================================================

name: Publish Staging Images to GHCR

on:
  workflow_dispatch:
  push:
    branches:
      - feature/phase-4l1-contextual-tax-intelligence-foundation

concurrency:
  group: publish-staging-images
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & Push SHA-Pinned Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo
        run: |
          echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Backend API Container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/atlas-api:${{ github.sha }}

      - name: Build and Push Frontend Web Container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/atlas-web:${{ github.sha }}

      - name: Summary
        run: |
          echo "### Staging Images Published to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "- **API Image:** \`ghcr.io/${{ steps.repo.outputs.name }}/atlas-api:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Web Image:** \`ghcr.io/${{ steps.repo.outputs.name }}/atlas-web:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${{ github.sha }}\` (Git SHA only)" >> $GITHUB_STEP_SUMMARY
