[package]
name = "atlas-app"
version = "0.1.0"
default-run = "atlas-app"
description = "Atlas Desktop Application"
authors = ["Project Atlas"]
edition = "2021"

[[bin]]
name = "atlas-app"
path = "src/main.rs"

[lib]
name = "atlas_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
keyring = { version = "4.2.0", features = ["v1"] }
tauri-plugin-notification = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
